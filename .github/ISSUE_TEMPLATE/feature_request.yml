name: Feature request
description: Suggest an improvement for MCP4Unreal
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Requests are welcome in any MCP4Unreal editor language. Describe the workflow and outcome instead of including private project content.
  - type: dropdown
    id: language
    attributes:
      label: Request language
      options:
        - English
        - العربية
        - Deutsch
        - Español
        - Français
        - Italiano
        - 日本語
        - 한국어
        - Polski
        - Português (Brasil)
        - Русский
        - Türkçe
        - 简体中文
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: What are you trying to accomplish, and what currently makes it difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without prescribing an unsafe implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: engine-version
    attributes:
      label: Relevant Unreal Engine version
      placeholder: 5.8.x
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: I removed credentials, private prompts, private paths, and unreleased project details.
          required: true
